name: Release Publish

on:
  push:
    branches:
      - master
    paths:
      - package.json

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Tag and publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # package.json also changes for dependency updates, so only a version without a release goes on.
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version files agree
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^    SDK_VERSION = \"${VERSION}\"$" mParticleCore.brs; then
            echo "::error::SDK_VERSION in mParticleCore.brs does not match package.json ($VERSION)"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Extract release notes
        if: steps.check.outputs.release == 'true'
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        with:
          release_notes_file: RELEASE_NOTES.md

      - name: Create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          gh release create "v$VERSION"
          --title "v$VERSION"
          --notes-file RELEASE_NOTES.md
          --target "$RELEASE_COMMIT"
          --latest
